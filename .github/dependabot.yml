version: 2
# Check for updates to GitHub Actions every week
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: github-actions
    directory: /.github/actions/get-chart
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: helm
    directories:
    - /bitnami/airflow
